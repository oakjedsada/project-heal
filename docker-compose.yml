services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mindcheck_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: MindCheck.Api/Dockerfile
    environment:
      ConnectionStrings__MindCheck: "Host=db;Port=5432;Database=mindcheck;Username=postgres;Password=postgres"
      Auth__JwtSigningKey: "local-docker-jwt-signing-key-at-least-32-bytes-long"
      Auth__BootstrapAdminUsername: "admin"
      Auth__BootstrapAdminEmail: "admin@example.com"
      Auth__BootstrapAdminPassword: "adminadmin"
      Auth__FrontendBaseUrl: "http://localhost:18081"
      # Real SMTP credentials come from a local, gitignored .env file (see
      # .env.example) — left blank here on purpose so this file stays safe to
      # commit. Password reset falls back to showing the link in-app when unset.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-MindCheck}"
      Cors__AllowedOrigins__0: "http://localhost:18081"
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:18080"
    ports:
      - "18081:80"
    depends_on:
      - api

volumes:
  mindcheck_db_data:
