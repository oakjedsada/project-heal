services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mindcheck_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: MindCheck.Api/Dockerfile
    environment:
      ConnectionStrings__MindCheck: "Host=db;Port=5432;Database=mindcheck;Username=postgres;Password=postgres"
      Auth__JwtSigningKey: "local-docker-jwt-signing-key-at-least-32-bytes-long"
      Auth__BootstrapAdminUsername: "admin"
      Auth__BootstrapAdminEmail: "admin@example.com"
      Auth__BootstrapAdminPassword: "local-docker-admin-password"
      Cors__AllowedOrigins__0: "http://localhost:18081"
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:18080"
    ports:
      - "18081:80"
    depends_on:
      - api

volumes:
  mindcheck_db_data:
